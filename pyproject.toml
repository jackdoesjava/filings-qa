[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fqa"
version = "0.1.0"
description = "Question answering over company filings (FinanceBench) with retrieval and a small tool-using agent on local models"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["fqa"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
